# 最小 CI：静态检查 + 全量测试（单版本 Python 3.12，与本地开发环境一致）
# 依赖装法与 docs/analysis/2026-09-12-current-state.md §8 记录的本地基线环境保持一致

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # 防 runner 挂死：2026-09-12 曾出现 7 个 run 挂 in_progress 数小时，
    # 无超时默认要拖满 6 小时才被回收。本地全量约 25s，runner 15 分钟绰绰有余。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Guard — block credentials and secrets
        run: |
          # 红线兜底：公开仓库不得包含 Cookie/Token/密钥类真实值。
          # 长度阈值过滤掉文档占位符（YOUR_TTWID、""）与测试短 dummy，只拦真实凭证。
          if grep -rInE "sessionid[\":= ][A-Za-z0-9_-]{20,}|sid_guard[\":= ][A-Za-z0-9_-]{20,}|ttwid[\":= ][A-Za-z0-9._-]{30,}|passport_csrf_token[\":= ][A-Za-z0-9_-]{20,}|msToken[\":= ][A-Za-z0-9_-]{100,}|sk-[A-Za-z0-9]{20,}" \
            --include='*.py' --include='*.md' --include='*.yml' --include='*.yaml' \
            --include='*.json' --include='*.sh' --include='*.toml' .; then
            echo "::error::扫描到疑似真实凭证（sessionid/ttwid/msToken/passport/sk-key），公开仓库禁止提交"
            exit 1
          fi
          echo "敏感扫描通过：未发现凭证模式"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=7.0" "pytest-asyncio>=0.21" "ruff>=0.4.0" "hypothesis>=6.0" "fastapi>=0.100" "uvicorn>=0.23" "pydantic>=2.0"

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q