# 最小 CI：静态检查 + 全量测试（单版本 Python 3.12，与本地开发环境一致）
# 依赖装法与 docs/analysis/2026-09-12-current-state.md §8 记录的本地基线环境保持一致

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=7.0" "pytest-asyncio>=0.21" "ruff>=0.4.0" "hypothesis>=6.0" "fastapi>=0.100" "uvicorn>=0.23" "pydantic>=2.0"

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q